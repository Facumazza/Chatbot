spring:
  application:
    name: chatbot-backend
  threads:
    virtual:
      enabled: true
  autoconfigure:
    # Sin usuario generado: el login real de operadores llega en la Etapa 8.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  session:
    jdbc:
      # Las tablas de sesión las crea Flyway.
      initialize-schema: never
  mvc:
    problemdetails:
      enabled: true

server:
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

whatsapp:
  app-secret: ${WHATSAPP_APP_SECRET:}
  verify-token: ${WHATSAPP_VERIFY_TOKEN:}
  graph-base-url: ${WHATSAPP_GRAPH_BASE_URL:https://graph.facebook.com}
  api-version: ${WHATSAPP_API_VERSION:v27.0}
  pilot:
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    business-account-id: ${WHATSAPP_BUSINESS_ACCOUNT_ID:}
    display-phone-number: ${WHATSAPP_DISPLAY_PHONE_NUMBER:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}

# Proveedor del modelo. OpenAI: api-format responses. Gemini: chat-completions con
# base-url https://generativelanguage.googleapis.com/v1beta/openai
llm:
  api-format: ${LLM_API_FORMAT:responses}
  api-key: ${LLM_API_KEY:}
  base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
  model: ${LLM_MODEL:gpt-6.1-terra}
  reasoning-effort: ${LLM_REASONING_EFFORT:low}
  # Incluye los tokens de razonamiento.
  max-output-tokens: 4000
  timeout: 60s
  # USD por millón de tokens, de la página de precios de OpenAI al 2026-11-10.
  # Los modelos gratuitos no figuran: su costo queda vacío.
  pricing:
    "[gpt-6.1-terra]": { input: 1.00, cached-input: 0.05, output: 5.00 }
    "[gpt-6-luna]": { input: 0.10, cached-input: 0.01, output: 0.50 }
    "[gpt-6.1-sol]": { input: 2.00, cached-input: 0.10, output: 10.00 }

catalog:
  sync-interval: PT15M
  grenlus:
    api-url: ${CATALOG_GRENLUS_API_URL:}
    public-url: ${CATALOG_GRENLUS_PUBLIC_URL:https://grenlus.pages.dev}
    max-age: PT2H

app:
  security:
    encryption-key: ${ENCRYPTION_KEY:}
  media:
    storage-path: ${MEDIA_STORAGE_PATH:storage/media}
    max-size: ${MEDIA_MAX_SIZE:25MB}
  workers:
    enabled: true
    webhook-delay: PT1S
    outbound-delay: PT1S
    media-delay: PT5S
    turn-delay: PT1S

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
  level:
    com.chatbot: INFO
