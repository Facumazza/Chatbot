spring:
  application:
    name: chatbot-backend
  threads:
    virtual:
      enabled: true
  autoconfigure:
    # Sin usuario generado: el login real de operadores llega en la Etapa 8.
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  session:
    jdbc:
      # Las tablas de sesión las crea Flyway.
      initialize-schema: never
  mvc:
    problemdetails:
      enabled: true

server:
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

whatsapp:
  app-secret: ${WHATSAPP_APP_SECRET:}
  verify-token: ${WHATSAPP_VERIFY_TOKEN:}
  graph-base-url: ${WHATSAPP_GRAPH_BASE_URL:https://graph.facebook.com}
  api-version: ${WHATSAPP_API_VERSION:v27.0}
  pilot:
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    business-account-id: ${WHATSAPP_BUSINESS_ACCOUNT_ID:}
    display-phone-number: ${WHATSAPP_DISPLAY_PHONE_NUMBER:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}

app:
  security:
    encryption-key: ${ENCRYPTION_KEY:}
  dev-echo:
    enabled: ${DEV_ECHO_ENABLED:false}
  media:
    storage-path: ${MEDIA_STORAGE_PATH:storage/media}
    max-size: ${MEDIA_MAX_SIZE:25MB}
  workers:
    enabled: true
    webhook-delay: PT1S
    outbound-delay: PT1S
    media-delay: PT5S

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
  level:
    com.chatbot: INFO
