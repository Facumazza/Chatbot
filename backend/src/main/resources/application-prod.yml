spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}

server:
  forward-headers-strategy: native
  servlet:
    session:
      cookie:
        secure: true

logging:
  structured:
    format:
      console: ecs
